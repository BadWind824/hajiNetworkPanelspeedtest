<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
        var lastTouchEnd = 0
        if (!!('ontouchstart' in window || navigator.maxTouchPoints)) {
            document.documentElement.addEventListener(
                'touchend',
                function(event) {
                    var now = Date.now()
                    if (now - lastTouchEnd <= 300) {
                        event.preventDefault()
                    }
                    lastTouchEnd = now
                }, {
                    passive: false
                }
            )
        }
        const darkModeQuery = window.matchMedia("(prefers-color-scheme: dark)");
        const classVal = document.getElementsByTagName('html')[0].classList;
        // 主题初始化：优先使用用户手动保存的偏好（theme=light/dark），否则跟随系统
        // 与 src/theme.ts 保持一致，尽早添加 dark 类避免页面闪烁
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'dark' || (storedTheme !== 'light' && darkModeQuery.matches)) {
            classVal.add("dark");
        }
        darkModeQuery.addEventListener("change", (e) => {
            // 用户手动指定过主题时不跟随系统
            if (storedTheme === 'dark' || storedTheme === 'light') return;
            e.matches ? classVal.add("dark") : classVal.remove("dark")
        });
    </script>
